name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m ruff check src tests benchmarks
      - run: python -m ruff format --check src tests benchmarks
      - run: python -m mypy
      - run: python -m pytest --cov=src/supply_chain_sentinel --cov-fail-under=85
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist supply-chain-sentinel
      - run: sentinel --version
