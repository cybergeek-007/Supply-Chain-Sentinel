name: Supply Chain Sentinel static triage
description: Inspect npm package-lock v2/v3 without running package code
inputs:
  lockfile:
    description: Path to package-lock.json
    default: package-lock.json
  fail-on:
    description: review, blocked, or never (scan errors always fail)
    default: review
  cache-dir:
    description: Trusted cache directory; defaults outside the target checkout in runner.temp
    default: ''
  update-advisories:
    description: Refresh and require OSV coverage for lockfile identities (true or false)
    default: 'true'
outputs:
  sarif:
    description: SARIF report path (available even on policy failure)
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - shell: bash
      run: python -I -m pip install --no-deps "$GITHUB_ACTION_PATH"
    - id: scan
      shell: bash
      env:
        SENTINEL_LOCKFILE: ${{ inputs.lockfile }}
        SENTINEL_FAIL_ON: ${{ inputs.fail-on }}
        SENTINEL_CACHE: ${{ inputs.cache-dir }}
        SENTINEL_UPDATE: ${{ inputs.update-advisories }}
      run: |
        echo "sarif=$RUNNER_TEMP/sentinel.sarif" >> "$GITHUB_OUTPUT"
        if [[ -z "$SENTINEL_CACHE" ]]; then SENTINEL_CACHE="$RUNNER_TEMP/sentinel-cache"; fi
        extra=()
        case "$SENTINEL_UPDATE" in
          true)
            python -I -m supply_chain_sentinel --cache-dir "$SENTINEL_CACHE" update-rules --lockfile "$SENTINEL_LOCKFILE"
            extra+=(--require-advisories)
            ;;
          false) ;;
          *) echo 'update-advisories must be true or false' >&2; exit 2 ;;
        esac
        python -I -m supply_chain_sentinel --cache-dir "$SENTINEL_CACHE" scan-lockfile "$SENTINEL_LOCKFILE" --format sarif --output "$RUNNER_TEMP/sentinel.sarif" --fail-on "$SENTINEL_FAIL_ON" "${extra[@]}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: sentinel-sarif
        path: ${{ runner.temp }}/sentinel.sarif
        if-no-files-found: warn
