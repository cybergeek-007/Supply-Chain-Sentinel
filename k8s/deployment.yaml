apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-sentinel
  labels:
    app: supply-chain-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supply-chain-sentinel
  template:
    metadata:
      labels:
        app: supply-chain-sentinel
    spec:
      containers:
        - name: sentinel-api
          image: supply-chain-sentinel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-sentinel
spec:
  type: ClusterIP
  selector:
    app: supply-chain-sentinel
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

