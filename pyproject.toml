[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-sentinel"
version = "0.3.0a1"
description = "Experimental, local-first static triage for npm packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
sentinel = "supply_chain_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["supply_chain_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["supply_chain_sentinel"]
mypy_path = "src"
